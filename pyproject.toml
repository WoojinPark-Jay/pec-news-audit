[project]
name = "pec-news-audit"
version = "0.1.0"
description = "Reproducibility package for a Preference-Exposure-Consumption audit of personalized news recommenders."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbclient>=0.8",
  "plotly>=5.18",
  "shap>=0.45,<0.50",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
