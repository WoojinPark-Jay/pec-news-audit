[project]
name = "pec-news-audit"
version = "0.3.0"
description = "Reproducibility package for a Preference-Exposure-Consumption audit of personalized news recommenders."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.8"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
